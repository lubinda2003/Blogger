# The Digital Toolkit - Content Automation Engine Settings
# Publication: The Digital Toolkit (https://digitaltoolkitguide.blogspot.com/)
# Tagline: Discover smarter tools. Work better. Do more.

publication:
  name: "The Digital Toolkit"
  website_url: "https://digitaltoolkitguide.blogspot.com/"
  tagline: "Discover smarter tools. Work better. Do more."
  target_audience: "International students, freelancers, entrepreneurs, creators, remote workers and everyday internet users"

pipeline:
  max_articles_per_run: 1
  dry_run: true
  publish_mode: "draft"
  locale: "en-US"
  timezone: "Africa/Lusaka"
  zambia_context_enabled: false

categories:
  names:
    - "AI and AI Tools"
    - "Office Software and Everyday Productivity"
    - "Spreadsheets, Data and Reporting"
    - "Graphic Design, Video and Content Creation"
    - "Freelancing and Remote Work"
    - "Digital Business, Marketing and E-commerce"
    - "Digital Learning, Research and Study Skills"
    - "Digital Foundations, Online Safety and Troubleshooting"

topic_queue:
  csv_path: "data/topics.csv"
  processed_json_path: "data/processed_topics.json"
  auto_deduplicate: true

gemini:
  model: "gemini-3.8-flash"
  fallback_model: "gemini-1.5-flash"
  temperature: 0.3
  max_output_tokens: 8192
  request_timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2.0

editorial:
  min_word_count: 800
  max_word_count: 2400
  min_credible_sources: 2
  featured_image_brief: true
  approved_affiliate_domains:
    - "notion.so"
    - "gumroad.com"
    - "upwork.com"
    - "payoneer.com"
  forbidden_phrases:
    - "get rich quick"
    - "guaranteed income"
    - "make $500 today"
    - "passive income secret"
    - "100% risk free money"
    - "overnight success"

research:
  provider: "tavily"
  search_depth: "basic"
  max_results_per_topic: 5
  min_verified_sources_required: 2
  domain_allowlist: []
  domain_blocklist: []

playwright:
  headless: true
  viewport:
    width: 1280
    height: 800
  device_scale_factor: 1.0
  navigation_timeout_ms: 30000
  wait_until: "networkidle"
  max_retries: 2

blogger:
  blog_id: ""
  default_labels:
    - "The Digital Toolkit"
