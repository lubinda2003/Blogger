name: Blogger Content Pipeline

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run mode (tests pipeline without modifying Blogger)"
        type: boolean
        required: true
        default: true
      publish_mode:
        description: "Publish mode: 'draft' (default, safe for review) or 'publish'"
        type: choice
        options:
          - draft
          - publish
        default: draft
      topic_id:
        description: "Optional specific topic ID from data/topics.csv (leave empty for auto-priority)"
        type: string
        required: false
        default: ""
      llm_provider:
        description: "LLM Provider: 'auto' (Gemini with Groq failover), 'groq', or 'gemini'"
        type: choice
        options:
          - auto
          - groq
          - gemini
        default: auto
      confirm_live_publish:
        description: "Confirm live publication (must be true for publish mode)"
        type: boolean
        required: false
        default: false

  # Scheduled automation is commented out for initial testing and safety.
  # Uncomment the schedule below only after end-to-end testing in draft mode.
  # schedule:
  #   - cron: "0 8 * * *" # Daily at 08:00 UTC

permissions:
  contents: write

# Concurrency group ensures only one pipeline runs at a time, preventing state collisions or duplicates
concurrency:
  group: blogger-content-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # Manual runs follow the dry_run input. Scheduled runs are dry-run unless the repository
      # variable SCHEDULED_LIVE is set to 'true' (Settings > Secrets and variables > Actions > Variables).
      DRY_RUN: ${{ github.event_name == 'schedule' && vars.SCHEDULED_LIVE != 'true' || github.event_name != 'schedule' && inputs.dry_run != false }}

    steps:
      # actions/checkout@v4 pinned to reviewed commit SHA
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # actions/setup-python@v5 pinned to reviewed commit SHA
      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Editorial & Publishing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          LLM_PROVIDER: ${{ inputs.llm_provider || vars.LLM_PROVIDER || secrets.LLM_PROVIDER || 'auto' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PUBLISH_MODE: ${{ inputs.publish_mode || 'draft' }}
          CONFIRM_LIVE_PUBLISH: ${{ inputs.confirm_live_publish == true }}
          TOPIC_ID: ${{ inputs.topic_id }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --live"
          fi
          ARGS="$ARGS --publish-mode $PUBLISH_MODE"
          if [ -n "$TOPIC_ID" ]; then
            ARGS="$ARGS --topic-id $TOPIC_ID"
          fi
          mkdir -p output
          set -o pipefail
          python -m src.main $ARGS 2>&1 | tee output/pipeline.log

      # Commit and push updated processed_topics.json back to repository on successful live runs
      - name: Commit and Push Processed Topics State
        # Also runs after a failed pipeline so failed-attempt counters persist and a bad topic can be skipped.
        if: ${{ !cancelled() && env.DRY_RUN == 'false' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/processed_topics.json; then
            echo "No state changes to commit (dry-run or unchanged queue)."
          else
            echo "Committing updated processed_topics.json to repository..."
            git add data/processed_topics.json
            git commit -m "chore(state): update processed topics [skip ci]"
            git fetch origin ${{ github.ref_name }}
            if ! git rebase origin/${{ github.ref_name }}; then
              echo "Error: Rebase conflict detected while integrating remote state. Aborting rebase and failing safe."
              git rebase --abort
              exit 1
            fi
            if ! git push origin ${{ github.ref_name }}; then
              echo "Error: Failed to push updated processed topics state to remote repository."
              exit 1
            fi
            echo "Successfully persisted state to repository."
          fi

      # actions/upload-artifact@v4 pinned to reviewed commit SHA
      - name: Upload Run Artifacts and Execution Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: content-pipeline-report
          path: |
            output/
            data/processed_topics.json
          if-no-files-found: warn
          retention-days: 14

      # Publishes the latest run's report (summary, log, draft, final post, header image) to the 'run-reports'
      # branch with secrets scrubbed, so a run can be reviewed without downloading artifacts. Only the most
      # recent run is kept: the branch is replaced each time.
      - name: Publish run report for review
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          REPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPO: ${{ github.repository }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_REF: ${{ github.ref_name }}
        run: |
          [ -d output ] || exit 0
          rm -rf /tmp/report && mkdir -p /tmp/report/latest && cp -r output/. /tmp/report/latest/
          python3 - <<'PY'
          import os, pathlib
          names = ("GEMINI_API_KEY", "GROQ_API_KEY", "TAVILY_API_KEY", "BLOGGER_BLOG_ID", "BLOGGER_CLIENT_ID",
                   "BLOGGER_CLIENT_SECRET", "BLOGGER_REFRESH_TOKEN", "REPORT_TOKEN")
          secrets = [v for v in (os.environ.get(n, "") for n in names) if len(v) >= 8]
          for path in pathlib.Path("/tmp/report/latest").rglob("*"):
              if path.is_file() and path.suffix.lower() in {".md", ".json", ".html", ".log", ".txt"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for secret in secrets:
                      text = text.replace(secret, "***")
                  path.write_text(text, encoding="utf-8")
          PY
          printf 'Run %s on branch %s\n' "$REPORT_RUN_ID" "$REPORT_REF" > /tmp/report/latest/RUN.txt
          cd /tmp/report
          git init -q
          git checkout -q -b run-reports
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "Run report $REPORT_RUN_ID"
          git push -q -f "https://x-access-token:${REPORT_TOKEN}@github.com/${REPORT_REPO}.git" run-reports
