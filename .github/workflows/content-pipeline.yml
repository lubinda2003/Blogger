name: Blogger Content Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *" # Daily at 08:00 UTC (10:00 AM Zambia time)

permissions:
  contents: write

# Concurrency group ensures only one pipeline runs at a time, preventing state collisions or duplicates
concurrency:
  group: blogger-content-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      # Real research, article and visual generation; Blogger writes remain drafts only.
      # PUBLISH_MODE is hardcoded to draft below and live publishing stays disabled.
      DRY_RUN: 'false'
      # Visuals are generated locally; paid Gemini image generation is explicitly disabled.
      IMAGE_PROVIDER: local
      GEMINI_IMAGE_GENERATION_ENABLED: 'false'
      ALLOW_PAID_IMAGE_GENERATION: 'false'

    steps:
      # actions/checkout@v4 pinned to reviewed commit SHA
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # actions/setup-python@v5 pinned to reviewed commit SHA
      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt

      - name: Set up Node.js visual tools
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install visual tooling
        run: npm install --prefix tools/visuals --no-audit --no-fund

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # Run the complete regression suite before any live generation or Blogger write.
      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run Editorial & Publishing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER || 'auto' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          PUBLISH_MODE: draft
          CONFIRM_LIVE_PUBLISH: false
          TOPIC_ID: ''
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          else
            ARGS="$ARGS --live"
          fi
          ARGS="$ARGS --publish-mode $PUBLISH_MODE"
          if [ -n "$TOPIC_ID" ]; then
            ARGS="$ARGS --topic-id $TOPIC_ID"
          fi
          mkdir -p output
          set -o pipefail
          python -m src.main $ARGS 2>&1 | tee output/pipeline.log

      # Commit and push updated processed_topics.json back to repository on successful live runs
      - name: Commit and Push Processed Topics State
        # Persist state even when generation fails; merge independent attempts without discarding counters.
        if: ${{ !cancelled() && env.DRY_RUN == 'false' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet data/processed_topics.json; then
            echo "No state changes to commit."
            exit 0
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          BASE_STATE="$(git show "${BASE_SHA}:data/processed_topics.json")"
          LOCAL_STATE="$(cat data/processed_topics.json)"
          export BASE_STATE LOCAL_STATE

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            REMOTE_STATE="$(git show "origin/${GITHUB_REF_NAME}:data/processed_topics.json")"
            export REMOTE_STATE

            python - <<'PY'
          import json, os
          from src.state_store import merge_state_snapshots
          base = json.loads(os.environ["BASE_STATE"])
          local = json.loads(os.environ["LOCAL_STATE"])
          remote = json.loads(os.environ["REMOTE_STATE"])
          merged = merge_state_snapshots(base, local, remote)
          with open("data/processed_topics.json", "w", encoding="utf-8") as handle:
             json.dump(merged, handle, indent=2, ensure_ascii=False)
             handle.write("\n")
          PY

            git add data/processed_topics.json
            if git diff --cached --quiet; then
              echo "Remote state already contains this update."
              exit 0
            fi
            git commit -m "chore(state): merge processed topic state [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Successfully persisted merged topic state."
              exit 0
            fi
            echo "State push raced with another update; refreshing and retrying (attempt ${attempt}/3)."
          done

          echo "Error: Could not persist topic state after three safe merge attempts."
          exit 1

      # actions/upload-artifact@v4 pinned to reviewed commit SHA
      - name: Upload Run Artifacts and Execution Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: content-pipeline-report
          path: |
            output/
            data/processed_topics.json
          if-no-files-found: warn
          retention-days: 14

      # Publishes the latest run's report (summary, log, draft, final post, header image) to the 'run-reports'
      # branch with secrets scrubbed, so a run can be reviewed without downloading artifacts. Only the most
      # recent run is kept: the branch is replaced each time.
      - name: Publish run report for review
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          REPORT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_REPO: ${{ github.repository }}
          REPORT_RUN_ID: ${{ github.run_id }}
          REPORT_REF: ${{ github.ref_name }}
        run: |
          [ -d output ] || exit 0
          rm -rf /tmp/report && mkdir -p /tmp/report/latest && cp -r output/. /tmp/report/latest/
          python3 - <<'PY'
          import os, pathlib
          names = ("GEMINI_API_KEY", "GEMINI_API_KEY_2", "GEMINI_API_KEY_3", "GROQ_API_KEY", "TAVILY_API_KEY", "BLOGGER_BLOG_ID", "BLOGGER_CLIENT_ID",
                   "BLOGGER_CLIENT_SECRET", "BLOGGER_REFRESH_TOKEN", "REPORT_TOKEN")
          secrets = [v for v in (os.environ.get(n, "") for n in names) if len(v) >= 8]
          for path in pathlib.Path("/tmp/report/latest").rglob("*"):
              if path.is_file() and path.suffix.lower() in {".md", ".json", ".html", ".log", ".txt"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for secret in secrets:
                      text = text.replace(secret, "***")
                  path.write_text(text, encoding="utf-8")
          PY
          printf 'Run %s on branch %s\n' "$REPORT_RUN_ID" "$REPORT_REF" > /tmp/report/latest/RUN.txt
          cd /tmp/report
          git init -q
          git checkout -q -b run-reports
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -q -m "Run report $REPORT_RUN_ID"
          git push -q -f "https://x-access-token:${REPORT_TOKEN}@github.com/${REPORT_REPO}.git" run-reports
